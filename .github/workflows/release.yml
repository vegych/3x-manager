name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - releases
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compute Build Version
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          VERSION_TAG="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "Building version ${VERSION_TAG} (code: ${BUILD_NUM})"

      - name: Restore Signing Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f debug.keystore app/debug.keystore || true
          mkdir -p ~/.android && cp -f debug.keystore ~/.android/debug.keystore || true
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" || true
        working-directory: ${{ github.workspace }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ env.VERSION_NAME }} --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        working-directory: ${{ github.workspace }}

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/3x-manager-${{ env.VERSION_TAG }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3x-manager-apk-${{ env.VERSION_TAG }}
          path: release-artifacts/*.apk

      - name: Generate Automatic Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## 🚀 Релиз 3x manager ${{ env.VERSION_TAG }}" > RELEASE_CHANGELOG.md
          echo "" >> RELEASE_CHANGELOG.md
          echo "### 📝 Что нового в этом обновлении:" >> RELEASE_CHANGELOG.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s" --no-merges >> RELEASE_CHANGELOG.md
          else
            git log -n 12 --pretty=format:"* %s" --no-merges >> RELEASE_CHANGELOG.md
          fi
          echo "" >> RELEASE_CHANGELOG.md
          echo "" >> RELEASE_CHANGELOG.md
          echo "---" >> RELEASE_CHANGELOG.md
          echo "### 📦 Скачать файл:" >> RELEASE_CHANGELOG.md
          echo "- **3x-manager-${{ env.VERSION_TAG }}.apk** (установочный пакет)" >> RELEASE_CHANGELOG.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: 3x manager ${{ env.VERSION_TAG }}
          body_path: RELEASE_CHANGELOG.md
          generate_release_notes: true
          files: release-artifacts/3x-manager-${{ env.VERSION_TAG }}.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
