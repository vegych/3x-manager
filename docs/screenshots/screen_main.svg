  <circle cx="640" cy="32" r="6" fill="#00E676"/>
  <rect x="655" y="24" width="24" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="658" y="27" width="16" height="8" rx="1.5" fill="#00E676"/>

  <!-- Top App Bar -->
